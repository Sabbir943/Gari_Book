    <circle cx="-52" cy="82" r="6" fill="#0f766e" stroke="none"/>
    <circle cx="52" cy="82" r="6" fill="#0f766e" stroke="none"/>
    <path d="M-40 -48h80" stroke="#6ee7b7" stroke-width="8"/>
