  <text x="400" y="430" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#ffffff">GARI<tspan fill="#6ee7b7">BOOK</tspan></text>
  <text x="400" y="470" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#a7f3d0" letter-spacing="4">IMAGE UNAVAILABLE</text>
